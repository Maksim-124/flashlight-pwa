<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Theme Flashlight PWA</title>
    <link rel="stylesheet" href="./styles/global.css">
    <link rel="manifest" href="./manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <script type="module" src="./components/theme-manager.js"></script>
</head>
<body>
    <theme-manager></theme-manager>
    
    <script>
        // PWA регистрация
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }

        // Закрытие выпадающего меню при клике вне его
        document.addEventListener('click', (e) => {
            if (!e.target.closest('theme-manager')) {
                const themeManager = document.querySelector('theme-manager');
                if (themeManager) {
                    themeManager.closeDropdown();
                }
            }
        });
    </script>
</body>
</html>
